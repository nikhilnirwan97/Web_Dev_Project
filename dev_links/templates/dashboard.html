<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Dev-Links</title>
    <!-- Google Fonts
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">Dev-Links 🚀</div>
            <div class="user-actions">
                <span class="hello-user">Hello, {{ username }}!</span>
                <button id="logoutBtn" class="btn-outline">Logout</button>
            </div>
        </div>
    </nav>

    <main class="dashboard-container">
        
        <div class="top-section">
            <div class="add-link-box">
                <h2>Add New Resource</h2>
                <form id="addLinkForm">
                    <div class="form-row">
                        <div class="input-group">
                            <label for="title">Title</label>
                            <input type="text" id="title" required placeholder="e.g. CSS Tricks">
                        </div>
                        <div class="input-group">
                            <label for="url">URL</label>
                            <input type="url" id="url" required placeholder="https://...">
                        </div>
                        <div class="input-group">
                            <label for="tag">Tag</label>
                            <input type="text" id="tag" placeholder="e.g. frontend">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Save Link</button>
                </form>
            </div>
        </div>

        <div class="view-controls">
            <h3 id="link-count" class="link-count">You have 0 links saved.</h3>
            
            <div class="filters">
                <input type="text" id="searchBar" placeholder="Search titles..." class="filter-input">
                <select id="tagFilter" class="filter-input">
                    <option value="">All Tags</option>
                    <!-- Options populated by JS -->
                </select>
            </div>
        </div>

        <!-- Links disappear and appear here! -->
        <div id="linksContainer" class="links-grid">
            <!-- empty state -->
            <div class="empty-state">
                <p>No links yet! Add your first resource 🚀</p>
            </div>
        </div>
    </main>

    <!-- the modal for editing -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Edit Resource</h2>
            <form id="editLinkForm">
                <input type="hidden" id="edit-id">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="input-group">
                    <label>Tag</label>
                    <input type="text" id="edit-tag">
                </div>
                <button type="submit" class="btn-primary">Update</button>
            </form>
        </div>
    </div>

    <!-- this handles all the dynamic stuff -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
