<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Gallery - Upload</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Gallery</div>
        <nav>
            <ul>
                <li><a href="index.html">Discover</a></li>
                <li><a href="upload.html" class="active">Upload</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main class="upload-container">
        <h1 class="page-title">Upload Media</h1>
        
        <!-- The form action and method are ready for your backend API -->
        <form action="/api/upload" method="POST" enctype="multipart/form-data" class="upload-form">
            
            <div class="form-group">
                <label for="media-file" class="upload-area">
                    <span class="upload-icon">📁</span>
                    <span class="upload-text">Drag & Drop or Click to Select File</span>
                    <input type="file" id="media-file" name="media-file" required>
                </label>
            </div>

            <div class="form-group">
                <label for="media-title">Title</label>
                <input type="text" id="media-title" name="media-title" placeholder="Enter title..." required>
            </div>

            <div class="form-group">
                <label for="media-type">Type</label>
                <select id="media-type" name="media-type" required>
                    <option value="" disabled selected>Select media type</option>
                    <option value="image">Image</option>
                    <option value="video">Video</option>
                    <option value="raw">Raw Footage</option>
                </select>
            </div>

            <button type="submit" class="btn-primary">Upload to Gallery</button>
        </form>
    </main>

    <footer style="margin-top: auto;">
        <p>&copy; 2023 Minimal Gallery.</p>
    </footer>

</body>
</html>
