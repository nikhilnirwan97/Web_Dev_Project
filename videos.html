<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Gallery - Videos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Gallery</div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Discover</a></li>
                <li><a href="upload.html">Upload</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <section class="controls-section">
        <div class="search-bar">
            <input type="text" placeholder="Search videos..." aria-label="Search gallery">
        </div>
        <div class="filters" aria-label="Filter media types">
            <a href="index.html" class="filter-btn">All</a>
            <a href="videos.html" class="filter-btn active">Videos</a>
            <a href="images.html" class="filter-btn">Images</a>
            <a href="raw.html" class="filter-btn">Raw</a>
        </div>
    </section>

    <main>
        <div class="gallery-container">
            
            <!-- Media Card 2 -->
            <article class="media-card" data-id="2">
                <div class="card-content">
                    <a href="view.html" class="card-overlay-link" aria-label="View Media"></a>
                    <div class="media-thumbnail">
                        <span class="media-badge">Video</span>
                        <div class="placeholder-img"></div>
                    </div>
                    <div class="card-details">
                        <h2 class="card-title">Architecture</h2>
                        <div class="card-meta">
                            <span>128 MB</span>
                            <span><time datetime="2023-10-24">Yesterday</time></span>
                        </div>
                        <div class="card-actions" style="position: relative; z-index: 2;">
                            <button class="btn-action edit" aria-label="Edit Architecture">Edit</button>
                            <button class="btn-action delete" aria-label="Delete Architecture">Delete</button>
                        </div>
                    </div>
                </div>
            </article>

            <!-- Media Card 5 -->
            <article class="media-card" data-id="5">
                <div class="card-content">
                    <a href="view.html" class="card-overlay-link" aria-label="View Media"></a>
                    <div class="media-thumbnail">
                        <span class="media-badge">Video</span>
                        <div class="placeholder-img"></div>
                    </div>
                    <div class="card-details">
                        <h2 class="card-title">Abstract Motion</h2>
                        <div class="card-meta">
                            <span>45 MB</span>
                            <span><time datetime="2023-10-08">Oct 08</time></span>
                        </div>
                        <div class="card-actions" style="position: relative; z-index: 2;">
                            <button class="btn-action edit" aria-label="Edit Abstract Motion">Edit</button>
                            <button class="btn-action delete" aria-label="Delete Abstract Motion">Delete</button>
                        </div>
                    </div>
                </div>
            </article>

        </div>
    </main>

    <footer>
        <p>&copy; 2023 Minimal Gallery.</p>
    </footer>

</body>
</html>
